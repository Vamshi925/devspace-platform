
spring.application.name=environment-service
server.port=8086

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devspace_environment}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Internal Services
devspace.services.template.url=${TEMPLATE_SERVICE_URL:http://localhost:8087}
devspace.services.provisioning.url=${PROVISIONING_SERVICE_URL:http://localhost:8088}
devspace.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8090}

# Internal Authentication
devspace.gateway.internal-key=${DEVSPACE_GATEWAY_KEY}
devspace.internal.api-key=${DEVSPACE_INTERNAL_API_KEY}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

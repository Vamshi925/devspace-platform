spring.application.name=environment-service

spring.datasource.url=jdbc:postgresql://localhost:5432/devspace_environment
spring.datasource.username=devspace
spring.datasource.password=devspace

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8086

devspace.services.template.url=http://localhost:8087
devspace.services.provisioning.url=http://localhost:8088
devspace.notification-service.url=http://localhost:8090

devspace.gateway.internal-key=${DEVSPACE_GATEWAY_KEY:devspace-gateway-secret}

devspace.internal.api-key=${DEVSPACE_INTERNAL_API_KEY:devspace-internal-secret}

spring.application.name=api-gateway

server.port=8080

devspace.jwt.secret=VGhpc0lzQURldlNwYWNlU2VjdXJlSldUU2lnbmluZ0tleUZvckRldlNwYWNlMjAyNg==

devspace.gateway.internal-key=${DEVSPACE_GATEWAY_KEY:devspace-gateway-secret}

# Environment Service
spring.cloud.gateway.server.webflux.routes[0].id=environment-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/environments/**

# Template Service
spring.cloud.gateway.server.webflux.routes[1].id=template-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8087
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/templates/**

# Login Service
spring.cloud.gateway.server.webflux.routes[2].id=login-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8089
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/auth/**,/api/admin/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8090
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
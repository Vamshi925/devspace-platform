
spring.application.name=api-gateway

server.port=8080

# Security
devspace.jwt.secret=${DEVSPACE_JWT_SECRET}
devspace.gateway.internal-key=${DEVSPACE_GATEWAY_KEY}

# Environment Service
spring.cloud.gateway.server.webflux.routes[0].id=environment-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ENVIRONMENT_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/environments/**

# Template Service
spring.cloud.gateway.server.webflux.routes[1].id=template-service
spring.cloud.gateway.server.webflux.routes[1].uri=${TEMPLATE_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/templates/**

# Login Service
spring.cloud.gateway.server.webflux.routes[2].id=login-service
spring.cloud.gateway.server.webflux.routes[2].uri=${LOGIN_SERVICE_URL:http://localhost:8089}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/auth/**,/api/admin/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8090}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**

# Dashboard - Environment Service
spring.cloud.gateway.server.webflux.routes[4].id=dashboard-service
spring.cloud.gateway.server.webflux.routes[4].uri=${ENVIRONMENT_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/dashboard/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

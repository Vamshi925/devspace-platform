spring.application.name=template-service

server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/devspace_template
spring.datasource.username=devspace
spring.datasource.password=devspace

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

devspace.gateway.internal-key=${DEVSPACE_GATEWAY_KEY:devspace-gateway-secret}

devspace.internal.api-key=${DEVSPACE_INTERNAL_API_KEY:devspace-internal-secret}
spring.application.name=login-service
server.port=8089

spring.datasource.url=${DB_URL: jdbc:postgresql://devspace-postgres-environment:5432/devspace_login}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

devspace.jwt.secret=${DEVSPACE_JWT_SECRET}
devspace.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

devspace.admin.email=${DEVSPACE_ADMIN_EMAIL:platformadmin@devspace.com}
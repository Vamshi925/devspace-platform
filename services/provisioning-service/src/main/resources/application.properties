spring.application.name=provisioning-service
server.port=8088

devspace.services.environment.url=${ENVIRONMENT_SERVICE_URL:http://localhost:8086}

devspace.kubernetes.mock=${KUBERNETES_MOCK:true}
devspace.ingress.base-url=${INGRESS_BASE_URL:http://devspace.local}

devspace.internal.api-key=${DEVSPACE_INTERNAL_API_KEY}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devspace-postgres
  namespace: devspace
spec:
  serviceName: devspace-postgres
  replicas: 1
  selector:
    matchLabels:
      app: devspace-postgres
  template:
    metadata:
      labels:
        app: devspace-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - secretRef:
            name: devspace-postgres-secret
        env:
        - name: POSTGRES_DB
          value: devspace_environment
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d postgres
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - exec pg_isready -U "$POSTGRES_USER" -d postgres
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: devspace-postgres-pvc
      - name: postgres-init
        configMap:
          name: devspace-postgres-init

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devspace-frontend
  namespace: devspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devspace-frontend
  template:
    metadata:
      labels:
        app: devspace-frontend
    spec:
      containers:
        - name: frontend
          image: vamshi925/devspace-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

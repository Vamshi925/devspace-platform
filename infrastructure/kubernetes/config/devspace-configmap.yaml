apiVersion: v1
kind: ConfigMap
metadata:
  name: devspace-config
  namespace: devspace
data:
  POSTGRES_HOST: devspace-postgres
  POSTGRES_PORT: "5432"

  ENVIRONMENT_SERVICE_URL: http://devspace-environment-service:8086
  TEMPLATE_SERVICE_URL: http://devspace-template-service:8087
  PROVISIONING_SERVICE_URL: http://devspace-provisioning-service:8088
  LOGIN_SERVICE_URL: http://devspace-login-service:8089
  NOTIFICATION_SERVICE_URL: http://devspace-notification-service:8090
